
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LeftoverLoop{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="nav-container">

            <a class="logo" href="{{ url_for('home') }}">
                ♻️ LeftoverLoop
            </a>

            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('find_food_page') }}">Find Food</a>
                <a href="{{ url_for('share_food_page') }}">Share Food</a>
                <a href="{{ url_for('requests_page') }}">Requests</a>
                <a href="{{ url_for('manage_page') }}">Manage Listings</a>
            </nav>

        </div>
    </header>

    <main class="page-content">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}

    </main>

    <footer class="site-footer">
        <p>LeftoverLoop — Share More, Waste Less 💚</p>
    </footer>

</body>
</html>
